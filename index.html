
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agalool Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #6a5acd, #20b2aa);
            color: #333333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            max-width: 700px;
            margin: 25px;
            padding: 45px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #244b9b;
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 19px;
            line-height: 1.7;
        }

        .highlight {
            color: #008b8b;
            font-weight: bold;
        }

        .welcome {
            color: #6a5acd;
            font-size: 24px;
            font-weight: bold;
        }

        footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 2px solid #e0e7ff;
            color: #777777;
            font-size: 14px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: linear-gradient(90deg, #244b9b, #008b8b);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .button:hover {
            background: linear-gradient(90deg, #008b8b, #244b9b);
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Welcome to Agalool!</h1>

        <p class="welcome">
            This is the Agalool Website.
        </p>

        <p>
            We are happy to welcome you to our
            <span class="highlight">online home</span>.
        </p>

        <p>
            Explore, discover, and stay tuned for
            <span class="highlight">exciting things to come!</span>
        </p>

        <a class="button" href="mailto:info@agalool.github.io">
            Contact Us
        </a>

        <footer>
            &copy; 2026 Agalool. All rights reserved.
        </footer>

    </div>
</body>
</html>
